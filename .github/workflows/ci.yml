name: CI

# Every gate here is keyless — nothing calls the Claude API — so this runs
# safely on pull requests from forks without exposing any secret. Adding the
# Python half did not change that, and must not.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

# A new push to a PR supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 20.x is the supported floor (--env-file arrived in 20.6);
        # 22.x is what the tutorial is written against.
        node: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # uv installs the Python toolchain and the exact versions in uv.lock.
      # The tutorial is written against 3.13, so pin it rather than inheriting
      # whatever the runner image happens to ship.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: install Python dependencies
        run: uv sync --locked

      # Does the code compile under strict mode? Once per language.
      - name: typecheck (TypeScript)
        run: npm run typecheck

      - name: typecheck (Python)
        run: npm run typecheck:py

      # Do the tutorials still match the code? Rebuilds src/ and pyweather/
      # from each document's own code blocks, typechecks that, and diffs it
      # back.
      - name: verify docs match the code
        run: npm run verify:docs
