name: CI

# Both gates are keyless — nothing here calls the Claude API — so this runs
# safely on pull requests from forks without exposing any secret.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

# A new push to a PR supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 20.x is the supported floor (--env-file arrived in 20.6);
        # 22.x is what the tutorial is written against.
        node: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Does the code compile under strict mode?
      - name: typecheck
        run: npm run typecheck

      # Does the tutorial still match the code? Rebuilds src/ from the
      # document's own code blocks, compiles that, and diffs it back.
      - name: verify docs match src/
        run: npm run verify:docs
